<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#15191e; --muted:#5b6670;
    --bg:#ffffff; --bg-soft:#f5f8f9;
    --brand:#121816; --accent:#43c7da; --accent-ink:#0b6f82;
    --border:#e3e8eb; --quote-bg:#eef7f9;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.65;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  /* ---- brand bar ---- */
  header.site{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    background:var(--brand); color:#fff;
    padding:.7rem clamp(1rem,4vw,2rem);
    border-bottom:2px solid var(--accent);
  }
  header.site .brand{
    font-weight:800; letter-spacing:.14em; font-size:.95rem;
    color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:.5rem;
  }
  header.site .brand .dot{
    width:.5rem; height:.5rem; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px rgba(67,199,218,.25);
  }
  header.site .langs{display:flex; gap:.35rem; font-family:var(--mono); font-size:.8rem}
  header.site .langs a{
    color:#cdd6da; text-decoration:none; padding:.2rem .55rem; border-radius:5px; line-height:1;
  }
  header.site .langs a:hover{color:#fff; background:rgba(255,255,255,.08)}
  header.site .langs a.active{color:var(--brand); background:var(--accent); font-weight:700}

  /* ---- document ---- */
  main.doc{
    max-width:720px; margin:0 auto;
    padding:2.4rem clamp(1.1rem,4vw,1.6rem) 4rem;
  }
  h1{font-size:clamp(1.7rem,4.5vw,2.15rem); line-height:1.15; font-weight:800; letter-spacing:-.02em; margin:.2rem 0 1rem}
  h2{font-size:1.28rem; font-weight:700; margin:2.6rem 0 .9rem; padding-top:1.1rem; border-top:1px solid var(--border)}
  h3{font-size:1.04rem; font-weight:700; margin:1.5rem 0 .5rem; color:#283038}
  h2,h3,[id]{scroll-margin-top:4.6rem}
  p,li{overflow-wrap:break-word}
  a{color:var(--accent-ink); text-decoration:underline; text-underline-offset:2px; text-decoration-thickness:.06em}
  a:hover{color:#08566a}
  strong{font-weight:700}
  hr{border:none; border-top:1px solid var(--border); margin:2.4rem 0}

  blockquote{
    margin:1.2rem 0; padding:.75rem 1.1rem;
    background:var(--quote-bg); border-inline-start:3px solid var(--accent);
    border-radius:0 6px 6px 0; color:#1c2a2e;
  }
  blockquote p{margin:.35rem 0}

  table{
    width:100%; border-collapse:collapse; margin:1.1rem 0; font-size:.88rem;
    display:block; overflow-x:auto;
  }
  th,td{border:1px solid var(--border); padding:.5rem .65rem; text-align:start; vertical-align:top}
  th{background:var(--bg-soft); font-weight:600; white-space:nowrap}
  tr:nth-child(even) td{background:#fafcfc}

  code{font-family:var(--mono); font-size:.86em; background:var(--bg-soft); padding:.12em .35em; border-radius:4px}

  /* meta lines (Effective date / Last updated) sit right under H1 */
  main.doc > p:first-of-type{font-family:var(--mono); font-size:.82rem; color:var(--muted); margin-top:0}

  footer.site-foot{
    border-top:1px solid var(--border); background:var(--bg-soft);
    color:var(--muted); font-size:.82rem; font-family:var(--mono);
    padding:1.4rem clamp(1.1rem,4vw,1.6rem); text-align:center;
  }

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}

  /* RTL */
  [dir="rtl"] main.doc{direction:rtl}
  [dir="rtl"] h1{letter-spacing:0}

  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  @media (max-width:520px){
    body{font-size:16px}
    header.site .brand{font-size:.85rem; letter-spacing:.1em}
  }
</style>
